[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronofin"
version = "0.1.0"
description = "ChronoFin: point-in-time, causally auditable financial research powered by Hy3"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tencent Rhino-Bird participant" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
demo = ["streamlit>=1.40", "Pillow>=10"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
chronofin = "chronofin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
